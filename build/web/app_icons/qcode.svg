<!-- qcode — the three finder eyes of a QR code in the app's three plate colours,
     with a single data module holding the fourth corner. The eyes are square
     because the app's own UI is border-radius 0; the tile is rounded because
     every icon in the ecosystem is. Gaps are wide enough that the three eyes
     stay separate at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="qcode">
  <rect width="64" height="64" rx="15" fill="#191C20"/>

  <!-- top-left eye — accent -->
  <rect x="11" y="11" width="18" height="18" fill="#E4628A"/>
  <rect x="16" y="16" width="8"  height="8"  fill="#191C20"/>
  <rect x="18" y="18" width="4"  height="4"  fill="#E7E9E3"/>

  <!-- top-right eye — cyan -->
  <rect x="35" y="11" width="18" height="18" fill="#54C2D2"/>
  <rect x="40" y="16" width="8"  height="8"  fill="#191C20"/>
  <rect x="42" y="18" width="4"  height="4"  fill="#E7E9E3"/>

  <!-- bottom-left eye — ink -->
  <rect x="11" y="35" width="18" height="18" fill="#E7E9E3"/>
  <rect x="16" y="40" width="8"  height="8"  fill="#191C20"/>
  <rect x="18" y="42" width="4"  height="4"  fill="#E7E9E3"/>

  <!-- one data module: keeps the fourth corner from reading as a fourth eye -->
  <rect x="40" y="40" width="8" height="8" fill="#E7E9E3"/>
</svg>
