<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b25"/>
      <stop offset="1" stop-color="#0b0b11"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glass tile -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8"
        fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- app list: status dot + name bar per row -->
  <!-- row 1 — online -->
  <circle cx="9" cy="9.5" r="2" fill="#4ade80" filter="url(#glow)"/>
  <rect x="13" y="8.3" width="12" height="2.4" rx="1.2" fill="#ffffff" fill-opacity="0.85"/>

  <!-- row 2 -->
  <circle cx="9" cy="16" r="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="13" y="14.8" width="12" height="2.4" rx="1.2" fill="#ffffff" fill-opacity="0.42"/>

  <!-- row 3 -->
  <circle cx="9" cy="22.5" r="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="13" y="21.3" width="8.5" height="2.4" rx="1.2" fill="#ffffff" fill-opacity="0.42"/>
</svg>
